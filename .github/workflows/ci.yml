name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (pytest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e 'backend[dev]'
      - name: Isolate Windows test temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP ("tts-more-pytest-{0}" -f $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
          "TTS_MORE_BACKEND_PYTHON=$((Get-Command python.exe).Source)" >> $env:GITHUB_ENV
      - name: Diagnose Windows recovery ACL
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          whoami /user
          Write-Host "TEMP=$env:TEMP"
          icacls.exe $env:TEMP
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'backend'
          $diagnostic = @'
          import os
          import tempfile
          from pathlib import Path
          from app.comfyui import reliability_recovery as recovery

          print("python", os.sys.executable)
          print("tempdir", tempfile.gettempdir())
          print("sid", recovery._windows_current_user_sid())
          print("expected", recovery._windows_private_sddl(directory=True))
          store = Path(tempfile.gettempdir()) / recovery.CAPABILITY_DIRECTORY
          try:
              actual = recovery._windows_security_descriptor_sddl(store)
          except Exception as exc:
              actual = f"<unavailable: {type(exc).__name__}: {exc}>"
          print("store", store)
          print("actual", actual)
          try:
              print("validated", recovery._capability_directory())
          except Exception as exc:
              print("validation_error", type(exc).__name__, str(exc))
              try:
                  print("actual_after", recovery._windows_security_descriptor_sddl(store))
              except Exception as after_exc:
                  print("actual_after_error", type(after_exc).__name__, str(after_exc))
          '@
          $diagnostic | python -
          icacls.exe (Join-Path $env:TEMP 'tts-more-reliability-recovery-capabilities')
      - name: Run pytest
        env:
          # The suite must pass without network egress; proxy vars break httpx.
          ALL_PROXY: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          TTS_MORE_SKIP_LEGACY_PORTABLE: "1"
          # Keep Windows tmp_path below the production portable-package path budget.
          PYTEST_ADDOPTS: ${{ runner.os == 'Windows' && format('--basetemp="{0}/pytest-{1}"', runner.temp, github.run_id) || '' }}
        run: pytest backend -q
      - name: Native Windows deployment validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $requiredShells = @("powershell.exe", "pwsh.exe")
          foreach ($shell in $requiredShells) {
            if (-not (Get-Command $shell -ErrorAction SilentlyContinue)) {
              throw "Required native deployment shell is missing: $shell"
            }
          }
          python -m pytest `
            "backend/tests/test_deploy_tool.py::test_windows_native_powershell_launchers_reject_unsafe_remote" `
            "backend/tests/test_deploy_tool.py::test_windows_native_drive_junction_and_gitdir_policy" `
            "backend/tests/test_prepare_scripts.py::test_windows_native_prepare_and_wrapper_fail_without_supported_conda" `
            -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Run vitest
        run: pnpm test
        working-directory: frontend
      - name: Build
        run: pnpm build
        working-directory: frontend
